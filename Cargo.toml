[package]
name = "x-bot-follower-remover"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Remove inactive X followers with a local terminal app and Chrome extension"
license = "MIT"

homepage = "https://github.com/altonwells/x-bot-follower-remover"
repository = "https://github.com/altonwells/x-bot-follower-remover"

[package.metadata]
bugs = "https://github.com/altonwells/x-bot-follower-remover/issues"

[[bin]]
name = "remover"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "6"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
getrandom = "0.3"
ratatui = { version = "=0.30.2", features = ["unstable-rendered-line-info"] }
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
tokio-tungstenite = "0.26.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
